[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "feathertail"
# Link as a true extension module (no libpython); `cargo test` omits this and uses auto-initialize.
features = ["extension-module"]

[project]
name = "feathertail"
version = "0.6.1"
description = "A tiny, fast, Rust-backed transformation core for Python table data"
authors = [{ name = "Odos Matthews", email = "odosmatthews@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eddiethedean/feathertail"
Documentation = "https://github.com/eddiethedean/feathertail#readme"
Repository = "https://github.com/eddiethedean/feathertail"
Issues = "https://github.com/eddiethedean/feathertail/issues"

[tool.ty.environment]
# Root `feathertail.pyi` is bundled in wheels via maturin; extra-paths keeps `ty check` working in-repo.
extra-paths = ["."]
