name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel (Unix)
        if: runner.os != 'Windows'
        run: pip install target/wheels/*.whl

      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          $wheel = Get-ChildItem target/wheels/*.whl | Select-Object -First 1
          pip install $wheel.FullName
        shell: pwsh

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: |
          python -m pytest tests/python/unit/ -v --tb=short

      - name: Test import
        run: |
          python -c "import feathertail as ft; print('Import successful')"
          python -c "import feathertail as ft; data = [{'a': 1, 'b': 2}]; frame = ft.TinyFrame.from_dicts(data); print('Basic functionality works')"

  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test
